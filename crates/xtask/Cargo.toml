[package]
name = "xtask"
description = "Release tooling: the update signing key, the manifest and the packages"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
updater.workspace = true
serde_json.workspace = true
# Renders the disk image's background from its SVG. GPUI already builds it.
resvg = { version = "0.46", default-features = false, features = ["text"] }

[dev-dependencies]
tempfile = "3"
