[package]
name = "wuapi-inbox"
description = "Open-source native desktop WhatsApp client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
brand-mark.workspace = true
client-core.workspace = true
client-provider.workspace = true
provider-mock.workspace = true
provider-wuapi.workspace = true
# The worked example of docs/PROVIDERS.md, only with `--features provider-example`.
provider-example = { workspace = true, optional = true }
# Updates: checked for, downloaded and verified in the background, and
# installed at the next start.
updater.workspace = true

chrono.workspace = true
cpal.workspace = true
getrandom.workspace = true
opus-decoder.workspace = true
ropus.workspace = true
symphonia.workspace = true
gpui-kit.workspace = true
# Decodes the bundled application icon. The same `image` GPUI already uses.
image.workspace = true
# The database key lives in the OS keychain.
keyring.workspace = true
# The online GIF search, when the user turns it on: plain HTTPS to the
# service they chose.
reqwest.workspace = true
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# The emoji tables are compiled in gzipped (pure Rust inflate, already in
# the tree through `image`), and the picker searches in the system's
# language.
flate2 = "1"
sys-locale = "0.3"

[features]
# Development aid: `WUAPI_INBOX_CAPTURE_SCRIPT` saves frames of the window as
# PNG files, drawn by the application itself (see `src/capture.rs`). Not part
# of a release build.
capture = ["gpui-kit/test-support"]
# Development aid: adds `--provider example`, the worked example of
# docs/PROVIDERS.md (an in-memory backend that says back what it is sent).
# Every line a new provider adds to this crate is marked with this feature.
# Not part of a release build.
provider-example = ["dep:provider-example"]

[dev-dependencies]
tempfile = "3"
# The online GIF search's service, played locally.
wiremock.workspace = true
# Animated images made on the spot for the tests.
client-core = { workspace = true, features = ["fixtures"] }
gpui-kit = { workspace = true, features = ["test-support"] }

# Where "Save to Downloads" saves.
[dependencies.dirs]
version = "6"

# Pictures on the clipboard, where the toolkit only writes text: the
# Wayland data-control protocol (wlroots compositors, KDE), and X11.
[target.'cfg(target_os = "linux")'.dependencies]
wl-clipboard-rs = "0.9"
arboard = "3.6"
