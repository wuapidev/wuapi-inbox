[package]
name = "client-core"
description = "Local store, outbox and sync engine: everything between a provider and the UI"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
client-provider.workspace = true
futures.workspace = true
image.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[features]
# Small animated images made on the spot, for the tests of whoever shows
# what this crate decodes.
fixtures = []

[dev-dependencies]
# `test-util` pauses the clock so retries run instantly.
tokio = { workspace = true, features = ["test-util"] }
provider-mock.workspace = true
# A provider written for one test.
async-trait.workspace = true
tempfile = "3"
