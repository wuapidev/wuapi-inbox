name: CI

# A change that only touches docs/ or the changelog builds nothing.
# README.md is not in the list: a test holds it to the example it shows.
on:
  pull_request:
    paths-ignore: ["docs/**", "CHANGELOG.md"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "CHANGELOG.md"]
  # Every platform, on any branch, when it is asked for.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Full debug information is most of what the workspace's own crates
  # cost to compile and link, and most of the cache. A backtrace still
  # names the file and the line.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # The workspace's own crates are built again on every run, and the
  # application's test binary is most of the wait: unoptimised it builds
  # in a third of the time, and its tests run longer by less than that
  # saves. The dependencies, GPUI among them, keep their optimisation.
  CARGO_PROFILE_DEV_OPT_LEVEL: "0"
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: >-
      ${{ matrix.os == 'ubuntu-latest' && 'Linux x86_64'
      || matrix.os == 'macos-latest' && 'macOS aarch64'
      || matrix.os == 'macos-15-intel' && 'macOS x86_64'
      || 'Windows x86_64' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - macos-15-intel
          # Set the repository variable WINDOWS_RUNNER to the label of a
          # larger runner of the organization to use it (those are billed,
          # in a public repository too); unset, the standard one.
          - ${{ vars.WINDOWS_RUNNER || 'windows-latest' }}
        # The Intel Mac is the slowest runner by minutes, and what it finds
        # the other Mac finds too, nearly always: a pull request leaves it
        # out. It runs on main, on request, and builds every release.
        # (Nothing here is in `include`: an entry there for a system that
        # is left out would bring it back.)
        exclude:
          - os: ${{ github.event_name == 'pull_request' && 'macos-15-intel' || 'none' }}
    steps:
      - uses: actions/checkout@v4

      # What the toolkit and the audio output link against. Everything
      # else (SQLCipher, OpenSSL) is built from source by cargo, except
      # OpenSSL on Windows (below).
      - name: Install the system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libasound2-dev libfontconfig1-dev libwayland-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libx11-xcb-dev

      # Building OpenSSL from source is the slowest single piece of a
      # Windows build. The runner image ships OpenSSL, so the tests link
      # that one; a release still builds its own (no OPENSSL_NO_VENDOR
      # there). If the image stops shipping it, nothing is set and cargo
      # builds it from source as before.
      - name: Use the runner's OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = 'C:\Program Files\OpenSSL'
          $lib = @("$root\lib\VC\x64\MD", "$root\lib") |
            Where-Object { Test-Path "$_\libcrypto.lib" } | Select-Object -First 1
          if ($lib -and (Test-Path "$root\include\openssl\ssl.h")) {
            "OPENSSL_NO_VENDOR=1" >> $env:GITHUB_ENV
            "OPENSSL_DIR=$root" >> $env:GITHUB_ENV
            "OPENSSL_LIB_DIR=$lib" >> $env:GITHUB_ENV
            "OPENSSL_INCLUDE_DIR=$root\include" >> $env:GITHUB_ENV
            "$root\bin" >> $env:GITHUB_PATH
            Write-Host "Linking the runner's OpenSSL from $lib"
          } else {
            Write-Host "No OpenSSL on this image: cargo builds it from source"
          }

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Kept after a failed run too: a build from nothing takes most of
      # the time this job has, on Windows. Only main saves it: a pull
      # request reads main's, and its own copy would take minutes to
      # upload and push others out of the repository's 10 GB.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Clippy builds the workspace a second time, in another profile.
      # It runs where that is cheap; the two slow runners only test.
      - name: Clippy
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest'
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          # The development features of the app, which a default build leaves out.
          cargo clippy -p wuapi-inbox --all-targets --features capture,provider-example --locked -- -D warnings

      # The window tests run without a display: the toolkit's test
      # platform draws nothing, on every system.
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast
