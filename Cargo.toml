[workspace]
resolver = "2"
members = [
    "crates/client-provider",
    "crates/provider-mock",
    "crates/provider-example",
    "crates/client-core",
    "crates/provider-wuapi",
    "crates/provider-native",
    "crates/provider-hub",
    "crates/app",
    "crates/brand-mark",
    "crates/updater",
    "crates/xtask",
]

[workspace.package]
version = "0.5.3"
edition = "2021"
license = "Apache-2.0"
# whatsapp-rust (provider-native) needs 1.94.
rust-version = "1.94"
publish = false

[workspace.dependencies]
client-provider = { path = "crates/client-provider" }
client-core = { path = "crates/client-core" }
provider-mock = { path = "crates/provider-mock" }
provider-example = { path = "crates/provider-example" }
provider-wuapi = { path = "crates/provider-wuapi" }
provider-native = { path = "crates/provider-native" }
provider-hub = { path = "crates/provider-hub" }
brand-mark = { path = "crates/brand-mark" }
updater = { path = "crates/updater" }

async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures = "0.3"
keyring = "4"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
# SQLite with SQLCipher: the database on disk is encrypted. The vendored
# OpenSSL supplies the cipher, so nothing has to be installed on Linux,
# macOS or Windows (building it needs perl and make).
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl", "cache"] }
getrandom = "0.3"
# Audio: containers and codecs in pure Rust (symphonia), Opus for voice
# notes in pure Rust (opus-decoder), and the system's audio output (cpal;
# on Linux it needs the ALSA development headers at build time).
symphonia = { version = "0.5", default-features = false, features = ["aac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
opus-decoder = "0.1"
# Encodes the voice notes recorded here: a Rust port of libopus, no C
# toolchain. BSD-3-Clause, like libopus.
ropus = "0.12"
cpal = "0.18"
# Decodes profile pictures and message images, and makes their thumbnails.
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
# Draws the pages of a PDF for the reader inside the application: a
# rasterizer in pure Rust, nothing of the system's. Apache-2.0 OR MIT.
hayro = "0.8"
# The words written on a picture before it is sent, drawn with the
# bundled Inter: glyph outlines to coverage, in pure Rust. Apache-2.0.
ab_glyph = "0.2"
# Names a sticker or GIF by its content, so that the same file is one.
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
wiremock = "0.6"

# The wuapi Rust SDK, generated from the OpenAPI spec.
# Source: https://github.com/wuapidev/wuapi-rust
wuapi = "0.14.0"
base64 = "0.22"

# The WhatsApp Web protocol itself, spoken from this machine (provider-native).
# Pinned to a commit: the crates.io release (0.7.0) links libsqlite3-sys 0.37,
# which cannot be in one binary with rusqlite 0.40's 0.38. Go back to a
# version number when a release has caught up.
# Source: https://github.com/oxidezap/whatsapp-rust
# Calls: the pure-Rust MLOW codec and the native relay transport. `voip-libopus`
# (the C codec) is left out on purpose: nothing to build in C for a call.
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "94c53e833805c58c9f5966b08d08c990650a651e", features = ["voip-mlow", "voip-relay-native"] }
# The key of the sessions' store is given through whatsapp-rust's own
# connection hook, which hands over a Diesel connection.
diesel = { version = "2.3", default-features = false, features = ["sqlite"] }
# The QR code a number is linked with, drawn here.
qrcode = { version = "0.14", default-features = false }

# UI. gpui-kit pins the matching GPUI snapshot (gpui-pre) and re-exports it
# together with gpui-component; see docs/ARCHITECTURE.md.
gpui-kit = "=0.7.0"

[profile.dev]
# GPUI's text shaping and layout are painfully slow unoptimised.
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
